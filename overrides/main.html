{% extends "base.html" %}

{% block extrahead %}
  <!-- 手机「添加到主屏幕」后以全屏应用方式打开，不显示浏览器地址栏和工具栏 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="飞飞">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
{% endblock %}

{% block scripts %}
  {{ super() }}
  <!-- 注册离线缓存（hooks/offline.py 生成 sw.js）：弱网、断网时也能打开看过和没看过的文章 -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register(new URL("{{ base_url }}/sw.js", location.href));
    }
  </script>
{% endblock %}
